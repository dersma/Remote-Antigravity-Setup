<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 150" width="620" height="150" role="img" aria-label="Remote Antigravity">
  <defs>
    <linearGradient id="raBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#152238"/>
    </linearGradient>
    <linearGradient id="raAccent" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="620" height="150" rx="22" fill="url(#raBg)"/>
  <rect x="20" y="15" width="120" height="120" rx="28" fill="#FFFFFF" fill-opacity="0.04"
        stroke="#FFFFFF" stroke-opacity="0.10"/>

  <!-- Stilisierter Antigravitations-Mark: schwebende Kugel, Auftriebspfeil, Feldbogen -->
  <circle cx="80" cy="72" r="16" fill="#F8FAFC"/>
  <g stroke="url(#raAccent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M80 46 V 30"/>
    <path d="M71 39 L80 30 L89 39"/>
  </g>
  <path d="M50 100 Q80 122 110 100" stroke="url(#raAccent)" stroke-width="6"
        stroke-linecap="round" fill="none"/>

  <text x="170" y="76" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
        font-size="46" font-weight="700" fill="#F8FAFC" letter-spacing="-0.5">Remote Antigravity</text>
  <text x="172" y="108" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
        font-size="21" font-weight="400" fill="#93A4C3">Antigravity IDE vom Handy steuern</text>
</svg>
